# Apache site for keepailocal.org: the static site from the repo's site/ folder, in /var/www/keepailocal,
# on any Apache server (Ubuntu + certbot).
#   sudo cp keepailocal.conf /etc/apache2/sites-available/ && sudo a2ensite keepailocal && sudo systemctl reload apache2
#   sudo certbot --apache -d keepailocal.org -d www.keepailocal.org -d keepailocal.com -d www.keepailocal.com
#   (choose certbot's redirect to HTTPS)
# The big app downloads are NOT served here: the site links to GitHub Releases.

<VirtualHost *:80>
    ServerName keepailocal.org
    ServerAlias www.keepailocal.org
    DocumentRoot /var/www/keepailocal
    <Directory /var/www/keepailocal>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    <IfModule mod_headers.c>
        # The site promises "loads nothing from other servers": enforce it.
        Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
        Header always set Referrer-Policy "no-referrer"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()"
        <FilesMatch "\.(woff2)$">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </FilesMatch>
        <FilesMatch "\.(mp4|png|svg)$">
            Header set Cache-Control "public, max-age=86400"
        </FilesMatch>
        <FilesMatch "\.(html|css|js)$">
            Header set Cache-Control "public, max-age=300"
        </FilesMatch>
    </IfModule>
    AddType font/woff2 .woff2

    ErrorLog ${APACHE_LOG_DIR}/keepailocal-error.log
    # No access log: we don't keep a record of who visits.
</VirtualHost>

# keepailocal.com (and www) -> keepailocal.org
<VirtualHost *:80>
    ServerName keepailocal.com
    ServerAlias www.keepailocal.com
    Redirect permanent / https://keepailocal.org/
</VirtualHost>
